on>                <button class="dev-b" onclick="setDev('mob',this)" title="Mobile"><i class="fas fa-mobile-alt"></i></button>            </div>            <div class="flex-sp"></div>            <button class="b bg bsm bi" onclick="zmPrev(-.1)" title="Zoom Out"><i class="fas fa-search-minus"></i></button>            <span style="font-size:11px;color:var(--tx3);min-width:36px;text-align:center;font-weight:600" id="zmLvl">100%</span>            <button class="b bg bsm bi" onclick="zmPrev(.1)" title="Zoom In"><i class="fas fa-search-plus"></i></button>            <button class="b bg bsm bi" onclick="toggleFullScreen()" title="Toggle Fullscreen" id="fsBtn"><i class="fas fa-expand"></i></button>        </div>        <div class="pane-body" id="prevBody">            <div id="prevWrapper" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px 0;">                <div id="mockupContainer" style="width:100%;height:100%;transition:all .3s ease">                    <div class="prev-empty" id="prevEmpty">                        <i class="fas fa-eye-slash"></i>                        <p>Click <b>Deobfuscate</b> to see the preview safely</p>                    </div>                    <iframe id="prevFrame" style="display:none;width:100%;height:100%;border:none;background:#fff" sandbox="allow-scripts allow-same-origin"></iframe>                </div>            </div>        </div>    </div></div><input type="file" id="fIn" accept=".html,.htm,.txt" style="display:none" onchange="handleFile(event)"><!-- Status Bar --><div class="status">    <div><span class="dot"></span><span id="statusTxt">Ready</span></div>    <div style="flex:1;text-align:center;font-size:10px;letter-spacing:0.5px;opacity:1;font-weight:800;color:var(--tx3);">© 2026 • Copyright © KhanhNguyen9872</div>    <div id="procTime"></div></div><!-- CodeMirror Scripts --><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/xml/xml.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/css/css.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/htmlmixed/htmlmixed.min.js"></script><!-- Added CodeMirror Placeholder Addon --><script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/addon/display/placeholder.min.js"></script><script>// ===== STATE & SETTINGS =====const S = { net: true, zm: 1, dev: 'desk', proc: false, mode: 'in' };let cmIn, cmOut;// ===== INITIALIZATION & THEME =====document.addEventListener("DOMContentLoaded", () => {    const isDark = document.documentElement.classList.contains('dark');    document.getElementById('thIco').className = isDark ? 'fas fa-moon' : 'fas fa-sun';    const cmTheme = isDark ? 'monokai' : 'idea';    // Load Settings    let v = localStorage.getItem('set_net');    if(v !== null) S.net = (v === 'true');    document.getElementById('setNet').classList.toggle('on', S.net);    // CodeMirror configuration with Auto-Placeholder included    cmIn = CodeMirror.fromTextArea(document.getElementById('inCode'), {        mode: 'htmlmixed', theme: cmTheme, lineNumbers: true, lineWrapping: true,        inputStyle: "contenteditable", spellcheck: false,        placeholder: "Paste obfuscated HTML here...\n\n• Use 'Upload HTML'\n• Paste from clipboard"    });    cmIn.on('change', updIn);        cmOut = CodeMirror.fromTextArea(document.getElementById('outCode'), {        mode: 'htmlmixed', theme: cmTheme, lineNumbers: true, lineWrapping: true,        readOnly: true, inputStyle: "contenteditable", spellcheck: false    });    cmOut.on('change', updOut);    setMode('in');    requestAnimationFrame(() => { cmIn.refresh(); cmOut.refresh(); });    // Mobile needs multiple refresh attempts as layout settles    [100, 300, 600, 1000].forEach(d => setTimeout(() => { if(cmIn) cmIn.refresh(); if(cmOut) cmOut.refresh(); }, d));    // Detect Android App Environment    if(window.AndroidBridge){ document.body.classList.add('is-app'); }    // ResizeObserver: auto-refresh CodeMirror when layout changes (mobile keyboard, orientation)    if(window.ResizeObserver) {        const ro = new ResizeObserver(() => {            if(cmIn) cmIn.refresh();            if(cmOut) cmOut.refresh();        });        document.querySelectorAll('.pane-body').forEach(el => ro.observe(el));    }});// ===== SETTINGS MODAL =====function openSettings() { document.getElementById('settingsModal').style.display = 'flex'; }function closeSettings() { document.getElementById('settingsModal').style.display = 'none'; }function toggleSet(k) {    S[k] = !S[k];    localStorage.setItem('set_'+k, S[k]);    document.getElementById('set' + k.charAt(0).toUpperCase() + k.slice(1)).classList.toggle('on', S[k]);}document.getElementById('settingsModal').addEventListener('click', function(e) { if(e.target === this) closeSettings(); });// ===== THEME =====function toggleTheme() {    const h = document.documentElement;    const isDark = !h.classList.contains('dark');    h.classList.toggle('dark', isDark);    document.getElementById('thIco').className = isDark ? 'fas fa-moon' : 'fas fa-sun';    localStorage.setItem('theme', isDark ? 'dark' : 'light');    const cmTheme = isDark ? 'monokai' : 'idea';    if(cmIn) cmIn.setOption('theme', cmTheme);    if(cmOut) cmOut.setOption('theme', cmTheme);}// ===== RESPONSIVE TABS LOGIC =====function setMode(mode) {    S.mode = mode;    const isDesk = window.innerWidth >= 769;    if (isDesk && mode === 'in') mode = 'out'; // Desktop dual-pane forced    document.getElementById('tb-in').classList.toggle('on', mode === 'in');    document.getElementById('tb-out').classList.toggle('on', mode === 'out');    document.getElementById('tb-prev').classList.toggle('on', mode === 'prev');    document.getElementById('pane-in').classList.toggle('active', mode === 'in' || isDesk);    document.getElementById('pane-out').classList.toggle('active', mode === 'out');    document.getElementById('pane-prev').classList.toggle('active', mode === 'prev');    setTimeout(() => { if(cmIn) cmIn.refresh(); if(cmOut) cmOut.refresh(); }, 50);    setTimeout(() => { if(cmIn) cmIn.refresh(); if(cmOut) cmOut.refresh(); }, 200);    setTimeout(() => { if(cmIn) cmIn.refresh(); if(cmOut) cmOut.refresh(); }, 500);}window.addEventListener('resize', () => { setMode(S.mode); });window.addEventListener('orientationchange', () => {    setTimeout(() => { setMode(S.mode); if(cmIn) cmIn.refresh(); if(cmOut) cmOut.refresh(); }, 200);});// ===== TOAST =====function toast(msg, type='inf', dur=2500){    const c = document.getElementById('toasts');    const t = document.createElement('div');    t.className = 'toast ' + type;    const ic = { ok: 'fa-check-circle', er: 'fa-exclamation-circle', inf: 'fa-info-circle' };    t.innerHTML = `<i class="fas ${ic[type]||ic.inf}"></i><span>${msg}</span>`;    c.appendChild(t);    setTimeout(() => { t.style.animation='toastOut .3s forwards'; setTimeout(()=>t.remove(),300); }, dur);}// ===== COUNTS & FILE OPS =====function updIn(){ document.getElementById('inCount').textContent = cmIn.getValue().length.toLocaleString(); }function updOut(){ document.getElementById('outCount').textContent = cmOut.getValue().length.toLocaleString(); }function upFile(){ document.getElementById('fIn').click(); }function handleFile(e){ .getValue(); if(!c) return toast('Empty','er'); dlFile(c,'clean_output.html'); toast('Downloaded!','ok'); }function dlFile(c, n){    if(window.AndroidBridge && window.AndroidBridge.downloadFile){        window.AndroidBridge.downloadFile(c, n);        return;    }    const b = new Blob([c], {type:'text/html'});    const u = URL.createObjectURL(b); const a = document.createElement('a');    a.href = u; a.download = n; document.body.appendChild(a); a.click();    document.body.removeChild(a); URL.revokeObjectURL(u);}function clearAll(){    cmIn.setValue(''); cmOut.setValue('');    updIn(); updOut();    document.getElementById('prevEmpty').style.display='flex';    document.getElementById('prevFrame').style.display='none';    document.getElementById('procTime').textContent='';    document.getElementById('statusTxt').textContent='Ready';    toast('Workspace Cleared','inf');}// ===== FORMAT =====function beautify(h){    let r='', ind=0; const t='  ';    h = h.replace(/>\s+</g,'>\n<');    const sc = /^<(area|base|br|col|embed|hr|img|input|link|meta|param|source|track|wbr)\b/i;    const cl = /^<\//; const op = /^<[a-zA-Z]/;    h.split('\n').forEach(l => {        l = l.trim(); if(!l) return;        if(cl.test(l)) ind = Math.max(0, ind-1);        r += t.repeat(ind) + l + '\n';        if(op.test(l) && !sc.test(l) && !cl.test(l) && !l.includes('</')) ind++;    });    return r.trim();}// ===== PREVIEW CONTROLS =====function setDev(d, btn){    S.dev = d;    const f = document.getElementById('prevFrame');    const container = document.getElementById('mockupContainer');        // Reset styles    container.className = "";    f.style.maxWidth = "100%";    f.style.margin = "0";        if (d === 'mob') {        container.classList.add('phone-mockup');        // Reparent iframe into inner for mockup styling        if (!container.querySelector <i class="fas fa-keyboard"></i> Shortcuts</h3>        <div>            <div class="sc-row"><span>Deobfuscate</span><span class="kbd">Ctrl + Enter</span></div>            <div class="sc-row"><span>Download Output</span><span class="kbd">Ctrl + S</span></div>            <div class="sc-row"><span>Copy Output</span><span class="kbd">Ctrl + Shift + C</span></div>            <div class="sc-row"><span>Upload File</span><span class="kbd">Ctrl + O</span></div>            <div class="sc-row"><span>Toggle Theme</span><span class="kbd">Ctrl + D</span></div>            <div class="sc-row"><span>Clear All</span><span class="kbd">Ctrl + W</span></div>        </div>        <div class="modal-f"><button class="b bg" style="border:1px solid var(--bd)" onclick="this.closest('.modal-ov').remove()">Close</button></div>    </div>`;    document.body.appendChild(ov);}document.addEventListener('keydown', e => {    if(e.ctrlKey && e.key === 'Enter') { e.preventDefault(); processHTML(); }    if(e.ctrlKey && e.key === 's') { e.preventDefault(); dlOutput(); }    if(e.ctrlKey && e.shiftKey && e.key === 'C') { e.preventDefault(); cpOut(); }    if(e.ctrlKey && e.key === 'o') { e.preventDefault(); upFile(); }    if(e.ctrlKey && e.key === 'd') { e.preventDefault(); toggleTheme(); }    if(e.ctrlKey && e.key === 'w') { e.preventDefault(); clearAll(); }    if(e.key === 'Escape') {         document.querySelectorAll('.modal-ov').forEach(el=>{if(el.id!=='settingsModal') el.remove()});         closeSettings();        if(document.getElementById('pane-prev').classList.contains('fullscr')) toggleFullScreen();    }});// ===== CUSTOM RIGHT-CLICK CONTEXT MENU (Input Pane) =====function showCtxMenu(x, y) {    document.getElementById('customCtx')?.remove();    const menu = document.createElement('div');    menu.id = 'customCtx';    menu.innerHTML = `        <div class="ctx-item" id="ctx-selall"><i class="fas fa-check-double"></i> Select All</div>        <div class="ctx-sep"></div>        <div class="ctx-item" id="ctx-copy"><i class="fas fa-copy"></i> Copy</div>        <div class="ctx-item" id="ctx-paste"><i class="fas fa-clipboard"></i> Paste</div>    `;    // Clamp to viewport    document.body.appendChild(menu);    const mw = menu.offsetWidth, mh = menu.offsetHeight;    const vw = window.innerWidth, vh = window.innerHeight;    menu.style.left = (x + mw > vw ? vw - mw - 8 : x) + 'px';    menu.style.top  = (y + mh > vh ? vh - mh - 8 : y) + 'px';    menu.querySelector('#ctx-selall').onclick = () => { cmIn.execCommand('selectAll'); menu.remove(); };    menu.querySelector('#ctx-copy').onclick   = () => { cpIn(); menu.remove(); };    menu.querySelector('#ctx-paste').onclick  = () => { menu.remove(); pasteClip(); };    setTimeout(() => document.addEventListener('click', () => menu.remove(), { once: true }), 30);}// Attach to input pane bodydocument.getElementById('pane-in').addEventListener('contextmenu', function(e) {    e.preventDefault();    e.stopPropagation();    showCtxMenu(e.clientX, e.clientY);});// ===== CORE ADVANCED DEOBFUSCATION ENGINE =====function buildSandbox(code, hid){    let inj = '';    // Network Blocker    if (S.net) {        inj += `window.fetch=function(){return Promise.reject()};window.XMLHttpRequest=function(){this.open=function(){};this.send=function(){}};window.WebSocket=function(){throw new Error()};navigator.sendBeacon=function(){return false};`;    }    const hs = `document.addEventListener('DOMContentLoaded',function(){    document.addEventListener('click',function(e){var t=e.target.closest('a');if(t)e.preventDefault()},true);    document.addEventListener('submit',function(e){e.preventDefault()},true);    window.__rs=[];    var o=new MutationObserver(function(m){m.forEach(function(a){a.removedNodes.forEach(function(n){if(n.tagName==='SCRIPT')window.__rs.push(n.outerHTML)})})});    o.observe(document.documentElement,{childList:true,subtree:true});});`;        const injectionTag = inj ? `<script data-ph="${hid}">try{${inj}}catch(e){}<\/script>` : '';    return `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style data-ph="${hid}">*{margin:0!important;padding:0!important}</style><script data-ph="${hid}">${hs}<\/script>${injectionTag}</head><body>${code}</body></html>`;}function cleanHTML(raw, hid){    let c = raw;    // 1. Remove sandbox injected tags (data-ph markers)    c = c.replace(new RegExp(`<(script|style)[^>]*data-ph="${hid}"[^>]*>[\\s\\S]*?</(script|style)>`,'gi'), '');    c = c.replace(/\s*data-ph="[^"]*"/g, '');    // 2. Remove obfuscator ASCII art / credit comment headers    c = c.replace(/<!--[\s\S]*?(?:Obfuscated By|obfuscated by|PROTECTED|RDX|html-code-generator|HTMLObfuscator|FUCK BY)[\s\S]*?-->/gi, '');    c = c.replace(/<!--\s*code by[^-]*-->/gi, '');    c = c.replace(/<!--\s*obfuscated[^-]*-->/gi, '');    // 3. Remove scripts with large base64 payloads (eval/atob obfuscation wrappers)    //    Catches: eval(atob(...)), (function(w,d){w['\x65\x76\x61\x6c'](w['\x61\x74\x6f\x62'](d))})(window,'...')    //    and any script block that contains a base64 string longer than 200 chars    c = c.replace(/<script[^>]*>[\s\S]*?[A-Za-z0-9+\/=]{200,}[\s\S]*?<\/script>/gi, function(match) {        // Only strip if it looks like an obfuscation wrapper (contains eval/atob/x65x76/x61x74)        if (/eval|atob|\\x65\\x76|\\x61\\x74|unescape|decodeURIComponent/i.test(match)) return '';        return match;    });    // 4. Remove standard obfuscated wrapper script blocks    c = c.replace(/<script[^>]*>[\s]*<!--[^>]*-->[\s]*document\.write\s*\([\s\S]*?<\/script>/gi, '');    c = c.replace(/<script[^>]*>\s*document\.write\s*\(\s*(unescape|atob|decodeURIComponent)\s*\([\s\S]*?\)\s*\)\s*;?\s*<\/script>/gi, '');    c = c.replace(/<script[^>]*>\s*eval\s*\(\s*(unescape|atob|decodeURIComponent)\s*\([\s\S]*?\)\s*\)\s*;?\s*<\/script>/gi, '');    // 5. Remove empty <head> or <body> tags left by sandbox wrapper bleeding in    c = c.replace(/<head>\s*<\/head>/gi, '');    // 6. Clean up extra blank lines    c = c.replace(/\n\s*\n\s*\n/g, '\n\n').trim();    // 7. Ensure DOCTYPE    if(!c.toUpperCase().startsWith('<!DOCTYPE')) c = '<!DOCTYPE html>\n' + c;    return c;}async function processHTML(){    const code = cmIn.getValue().trim();    if(!code){ toast('Paste obfuscated HTML first!', 'er'); return; }        // 1. Restriction: Verify if it's HTML/JS    const isHTML = /<[a-z][\s\S]*>/i.test(code);    const isJS = /function|var\s|let\s|const\s|=>|\.prototype|window\.|document\.|eval\(|atob\(|unescape\(|_0x/i.test(code);        if (!isHTML && !isJS) {        toast('Invalid Code: Please provide HTML or JavaScript to deobfuscate!', 'er', 4000);        return;    }    if(S.proc) return;    S.proc = true;    document.getElementById('statusTxt').textContent = 'Processing Code...';    const ld = document.createElement('div'); ld.className = 'loader'; ld.id = 'loader';    ld.innerHTML = '<div class="spin"></div><span>Deobfuscating...</span>';    document.body.appendChild(ld);    const t0 = performance.now();    const hid = 'd_' + Math.random().toString(36).substring(2,8);    try {        const sandbox = buildSandbox(code, hid);        const frame = document.createElement('iframe');        frame.style.cssText = 'position:fixed;left:-9999px;top:-9999px;width:1px;height:1px;opacity:0';        frame.sandbox = 'allow-scripts allow-same-origin';        document.body.appendChild(frame);        await new Promise((res, rej) => {            const to = setTimeout(() => rej(new Error('Timeout - script stuck or frozen')), 15000);            frame.onload = () => { clearTimeout(to); setTimeout(res, 2000); };            frame.onerror = () => { clearTimeout(to); setTimeout(res, 1000); };            frame.srcdoc = sandbox;        });        let extracted = '';        try {             extracted = frame.contentDocument.documentElement.outerHTML;         } catch(e) {             try {                 extracted = frame.contentWindow.document.documentElement.outerHTML;             } catch(e2) {                 extracted = '';             }         }        // Fix: if body contains a document.write(unescape/atob) script, the true        // decoded content is already in the DOM after it — extract body innerHTML        // and rebuild cleanly to avoid the wrapper script leaking into output.        try {            const bodyHTML = frame.contentDocument.body.innerHTML || '';            const hasObfWrapper = /<script[^>]*>[\s\S]*?document\.write\s*\(\s*(unescape|atob|decodeURIComponent)/i.test(bodyHTML);            if (hasObfWrapper) {                // Create a temp div, remove all script tags that are pure obf wrappers                const tmp = frame.contentDocument.createElement('div');                tmp.innerHTML = bodyHTML;                tmp.querySelectorAll('script').forEach(s => {                    if (/document\.write\s*\(\s*(unescape|atob|decodeURIComponent)/i.test(s.textContent)) {                        s.remove();                    }                });                const cleanBody = tmp.innerHTML.trim();                // Rebuild full HTML from head + cleaned body                const headHTML = frame.contentDocument.head.innerHTML || '';                extracted = `<html><head>${headHTML}</head><body>${cleanBody}</body></html>`;            }        } catch(e2) { /* silently ignore, use original extracted */ }        let removed = [];        try { removed = frame.contentWindow.__rs || []; } catch(e){}        // Smart logic to switch to preview if output is blocked or missing        if(!extracted || extracted.trim() === '' || extracted.replace(/\s/g, '') === '<html><head></head><body></body></html>' || extracted.replace(/\s/g, '') === '<!DOCTYPEhtml><html><head></head><body></body></html>') {                        cmOut.setValue("No output received. The script might have executed a redirect or blocked cross-origin DOM access.");            updOut();            toast('No code output found. Switching to Preview...', 'inf', 4000);                        // Render original code in preview to allow viewing of redirect            document.getElementById('prevEmpty').style.display = 'none';            const pf = document.getElementById('prevFrame');            pf.style.display = 'block';            pf.srcdoc = code;            setMode('prev'); // Auto-Switch to Preview pane        } else {            let clean = cleanHTML(extracted, hid);            if(removed.length > 0){                removed.forEach(s => { if(s && s.trim() && !clean.includes(s.trim())) clean = clean.replace('</body>', s+'\n</body>'); });            }            // Auto-beautify format by default            clean = beautify(clean);            cmOut.setValue(clean);            updOut();            // Force refresh after setValue on mobile            setTimeout(() => { if(cmOut) cmOut.refresh(); }, 100);            document.getElementById('prevEmpty').style.display = 'none';            const pf = document.getElementById('prevFrame');            pf.style.display = 'block';            const hid2 = 'p_' + Math.random().toString(36).substring(2,8);            pf.srcdoc = buildSandbox(clean, hid2);            if(window.innerWidth < 769) setMode('out');        }        const elapsed = ((performance.now()-t0)/1000).toFixed(2);        document.getElementById('procTime').textContent = elapsed + 's';        document.getElementById('statusTxt').textContent = 'Done';        document.body.removeChild(frame);    } catch(e) {        toast('Error: ' + e.message, 'er', 4000);        document.getElementById('statusTxt').textContent = 'Failed';    } finally {        S.proc = false;        const l = document.getElementById('loader'); if(l) l.remove();    }}</script></body></html>
